<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruộng thuê – UI game cơ bản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#4f7a34;
  --ink:#27336e;
  --ink-soft:#4a5596;
  --paper:#f7f8f1;
  --grid:#c9bde0;
  --margin:#d65a52;
  --hud:#fffdf6;
  --hud-text:#2c2a22;
  --shadow:0 3px 0 rgba(40,30,10,.25),0 8px 18px rgba(20,15,5,.25);
  --gold:#e0b23a;
  --leaf:#3f8f3a;
  --danger:#b8352c;
  --good:#2f7a3a;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-hand:"Patrick Hand","Comic Neue","Segoe Print","Chalkboard SE",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2c4620; --shadow:0 3px 0 rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ --bg:#2c4620; --shadow:0 3px 0 rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ margin:0; height:100%; background:var(--bg); font-family:var(--font-ui); color:var(--hud-text); overflow:hidden; }
button{ font:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid #ffd54a; outline-offset:2px; }

#game{ position:relative; width:100%; height:100%; overflow:hidden; }
#world{ position:absolute; inset:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
#world::-webkit-scrollbar{ display:none; }
#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.obj{ cursor:pointer; }
.obj:focus{ outline:none; }
.obj:focus-visible .hl, .obj:hover .hl{ opacity:1; }
.hl{ opacity:0; transition:opacity .15s; }
#char{ transition:transform 1.1s cubic-bezier(.45,.05,.3,1); }
#tint{ transition:opacity 1.2s; pointer-events:none; }
#stars{ transition:opacity 1.2s; pointer-events:none; }

/* rain */
#rain{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .8s;
  background-image:repeating-linear-gradient(105deg, rgba(220,235,255,.0) 0 14px, rgba(220,235,255,.45) 14px 15px, rgba(220,235,255,0) 15px 34px);
  background-size:120px 120px; animation:rain .5s linear infinite; }
#rain.on{ opacity:.55; } #rain.heavy{ opacity:.85; animation-duration:.3s; }
@keyframes rain{ to{ background-position:-40px 120px; } }

/* HUD: lịch bóc */
.hud{ position:absolute; z-index:5; }
#calendar{ top:12px; left:12px; width:118px; background:var(--hud); border-radius:4px 4px 6px 6px; box-shadow:var(--shadow); text-align:center; transform-origin:top center; }
#calendar .ring{ height:10px; background:#6b6b6b; border-radius:4px 4px 0 0; position:relative; }
#calendar .ring::before,#calendar .ring::after{ content:""; position:absolute; top:3px; width:8px; height:8px; border-radius:50%; background:#2b2b2b; }
#calendar .ring::before{ left:28px; } #calendar .ring::after{ right:28px; }
#calendar .mon{ background:var(--margin); color:#fff; font-weight:600; font-size:13px; padding:3px 0; }
#calendar .num{ font-size:52px; font-weight:700; line-height:1; color:var(--margin); padding:6px 0 0; }
#calendar .wd{ font-size:13px; font-weight:600; }
#calendar .sub{ font-size:11px; color:#6d6a60; padding:3px 6px 8px; line-height:1.3; }
#calendar.flip{ animation:flip .38s ease-in; }
@keyframes flip{ 0%{ transform:rotateX(0); } 50%{ transform:rotateX(80deg); } 100%{ transform:rotateX(0); } }

#purse{ top:12px; right:12px; width:196px; background:var(--hud); border-radius:6px; box-shadow:var(--shadow); padding:10px 12px; }
#purse .cash{ font-family:var(--font-hand); font-size:28px; color:var(--ink); line-height:1; }
#purse .lbl{ font-size:11px; color:#6d6a60; }
.bar{ height:8px; background:#e5e0cf; border-radius:4px; overflow:hidden; margin:3px 0 7px; }
.bar i{ display:block; height:100%; background:var(--leaf); transition:width .4s; }
#uyTinBar i{ background:var(--gold); }
#wxNow{ display:flex; align-items:center; gap:6px; font-size:12px; margin-top:2px; }

/* phase strip */
#strip{ left:50%; bottom:12px; transform:translateX(-50%); width:min(640px, calc(100% - 24px)); background:rgba(255,253,246,.96); border-radius:10px; box-shadow:var(--shadow); padding:10px 14px; display:flex; align-items:center; gap:14px; }
#sunArc{ flex:0 0 auto; }
#prompt{ flex:1; font-size:14px; line-height:1.35; }
#prompt b{ font-weight:700; }
.btn{ border:none; border-radius:8px; padding:9px 14px; font-weight:600; background:var(--ink); color:#fff; box-shadow:0 2px 0 rgba(0,0,0,.25); }
.btn:hover{ filter:brightness(1.1); }
.btn.ghost{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

/* hover tag */
#tag{ position:absolute; z-index:6; pointer-events:none; background:#2c2a22; color:#fff; font-size:12px; padding:4px 8px; border-radius:4px; opacity:0; transform:translate(-50%,-130%); transition:opacity .12s; white-space:nowrap; }

/* toast */
#toast{ position:absolute; left:50%; top:14px; transform:translate(-50%,-80px); z-index:7; background:var(--paper); font-family:var(--font-hand); font-size:19px; color:var(--ink); padding:8px 16px; box-shadow:var(--shadow); transition:transform .35s; max-width:min(520px,calc(100% - 290px)); text-align:center; }
#toast.show{ transform:translate(-50%,0); }

/* paper: vở ô ly */
.paper{ background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,189,224,.45) 1px, transparent 1px),
    linear-gradient(rgba(201,189,224,.35) 1px, transparent 1px);
  background-size:100% 100%, 100% 32px, 8px 8px, 100% 8px;
  color:var(--ink); font-family:var(--font-hand); }
.note{ position:absolute; z-index:8; width:270px; padding:18px 16px 14px 50px; box-shadow:var(--shadow); border-radius:2px; font-size:18px; line-height:1.3; }
.note::before{ content:""; position:absolute; top:-9px; left:50%; width:74px; height:20px; transform:translateX(-50%) rotate(-3deg); background:rgba(235,220,160,.85); }
.note h3{ margin:0 0 4px; font-size:22px; font-weight:400; }
.note .meta{ font-size:16px; color:var(--ink-soft); margin-bottom:6px; }
.note .sign{ color:var(--danger); }
.note .acts{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.act{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--font-ui); font-size:13px; background:#fff; border:1.5px solid var(--ink); color:var(--ink); border-radius:6px; padding:6px 9px; text-align:left; }
.act small{ color:#6d6a60; font-size:11px; white-space:nowrap; }
.act:hover{ background:#eef0fb; }
.act[disabled]{ opacity:.45; cursor:not-allowed; }
.act.credit{ border-style:dashed; }
.why{ font-family:var(--font-ui); font-size:11px; color:var(--danger); margin-top:-2px; }
.close{ position:absolute; top:6px; right:8px; background:none; border:none; font-size:22px; color:var(--ink-soft); line-height:1; }

/* notebook modal */
#veil{ position:absolute; inset:0; z-index:9; background:rgba(15,20,10,.45); opacity:0; pointer-events:none; transition:opacity .3s; }
#veil.show{ opacity:1; pointer-events:auto; }
.book{ position:absolute; z-index:10; left:50%; top:50%; width:min(560px, calc(100% - 24px)); max-height:calc(100% - 40px); overflow:auto; transform:translate(-50%,-46%) rotate(-1deg); opacity:0; pointer-events:none; transition:transform .35s, opacity .3s; padding:22px 22px 18px 58px; box-shadow:0 20px 50px rgba(0,0,0,.45); border-radius:3px; font-size:19px; line-height:32px; }
.book.show{ transform:translate(-50%,-50%) rotate(-1deg); opacity:1; pointer-events:auto; }
.book h2{ font-size:30px; font-weight:400; margin:0; line-height:40px; }
.book h4{ font-size:21px; font-weight:400; margin:10px 0 0; color:var(--margin); line-height:32px; }
.book p{ margin:0; }
.fc{ display:flex; gap:10px; flex-wrap:wrap; }
.fc div{ display:flex; align-items:center; gap:6px; min-width:140px; }
.fc small{ font-size:15px; color:var(--ink-soft); }
.book .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; font-family:var(--font-ui); }
.typed{ white-space:pre-wrap; }
.check{ display:flex; gap:10px; align-items:center; cursor:pointer; }
.check input{ width:18px; height:18px; accent-color:var(--ink); }
.book select{ font:inherit; font-family:var(--font-ui); font-size:14px; border:1.5px solid var(--ink); border-radius:6px; padding:3px 6px; background:#fff; color:var(--ink); }
.ledger-line{ display:flex; justify-content:space-between; opacity:0; transform:translateX(-6px); transition:opacity .3s, transform .3s; }
.ledger-line.in{ opacity:1; transform:none; }
.ledger-line.total{ font-size:28px; line-height:44px; border-top:2px solid var(--ink); margin-top:6px; }
.pos{ color:var(--good); } .neg{ color:var(--danger); }

@media (max-width:640px){
  #scene{ position:relative; width:auto; height:100%; aspect-ratio:1200/720; }
  #calendar{ width:92px; } #calendar .num{ font-size:38px; } #calendar .sub{ display:none; }
  #purse{ width:150px; padding:8px 10px; } #purse .cash{ font-size:22px; }
  #strip{ flex-wrap:wrap; gap:8px; } #sunArc{ display:none; } #prompt{ font-size:13px; flex-basis:100%; }
  #toast{ max-width:calc(100% - 24px); top:auto; bottom:120px; transform:translate(-50%,200px); }
  #toast.show{ transform:translate(-50%,0); }
  .note{ width:min(270px, calc(100% - 24px)); }
}
@media (prefers-reduced-motion: reduce){
  #rain{ animation:none; } #char{ transition:none; } #calendar.flip{ animation:none; }
  .book{ transition:opacity .2s; } .ledger-line{ transition:none; }
}
</style>
</head>
<body>
<div id="game">
  <div id="world"><svg id="scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" aria-label="Khung cảnh ruộng lúa">
    <defs>
      <pattern id="p-empty" width="40" height="18" patternUnits="userSpaceOnUse"><path d="M4 10 q6 -4 12 0 t12 0" fill="none" stroke="rgba(230,245,245,.45)" stroke-width="1.5"/></pattern>
      <pattern id="p-germination" width="14" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1.4" fill="#b8e07a"/><circle cx="11" cy="11" r="1.2" fill="#a6d466"/></pattern>
      <pattern id="p-tillering" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M5 13 L4 6 M7 13 L7 4 M9 13 L10 6" stroke="#7fc04a" stroke-width="1.6" stroke-linecap="round"/></pattern>
      <pattern id="p-panicle" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M5 14 L3 3 M7 14 L7 1 M9 14 L11 3 M6 14 L5 5" stroke="#3f8f3a" stroke-width="1.8" stroke-linecap="round"/></pattern>
      <pattern id="p-flowering" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M5 14 L3 3 M7 14 L7 1 M9 14 L11 3" stroke="#4d9a3c" stroke-width="1.8" stroke-linecap="round"/><circle cx="3" cy="3" r="1.3" fill="#f3efc8"/><circle cx="7" cy="1.5" r="1.3" fill="#f3efc8"/><circle cx="11" cy="3" r="1.3" fill="#f3efc8"/></pattern>
      <pattern id="p-ripening" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M5 14 Q4 5 8 3 M8 14 Q8 5 12 4 M3 14 Q2 7 5 5" stroke="#b9ad3c" stroke-width="1.8" fill="none" stroke-linecap="round"/></pattern>
      <pattern id="p-harvestable" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M5 14 Q4 5 9 4 M8 14 Q8 5 13 5 M3 14 Q2 7 6 6" stroke="#e0b23a" stroke-width="2" fill="none" stroke-linecap="round"/></pattern>
      <pattern id="thatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#9c7632" stroke-width="2"/></pattern>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff4c2" stop-opacity=".9"/><stop offset="1" stop-color="#fff4c2" stop-opacity="0"/></radialGradient>
    </defs>

    <!-- ground -->
    <rect width="1200" height="720" fill="#79a64a"/>
    <path d="M0 0 H1200 V720 H0Z" fill="none"/>
    <!-- road -->
    <path d="M0 70 C300 95 700 55 1200 88 L1200 128 C700 96 300 136 0 112Z" fill="#c9a56b"/>
    <path d="M0 92 C300 115 700 75 1200 108" stroke="#b28c52" stroke-width="2" stroke-dasharray="6 10" fill="none"/>
    <!-- canal -->
    <path d="M0 596 C300 575 800 615 1200 588 L1200 690 C800 712 300 676 0 700Z" fill="#4e9c9a"/>
    <path d="M40 640 q20 -6 40 0 M420 628 q20 -6 40 0 M840 646 q20 -6 40 0" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none"/>
    <!-- boat -->
    <g transform="translate(980 625)"><path d="M-60 0 Q0 22 60 0 L50 -6 Q0 10 -50 -6Z" fill="#7a5433"/></g>
    <!-- path house to field -->
    <path d="M250 380 C300 380 320 360 360 356" stroke="#b28c52" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- trees -->
    <g id="trees">
      <g transform="translate(70 170)"><path d="M0 0 C4 -60 8 -100 14 -130" stroke="#8a6a3f" stroke-width="7" fill="none"/><g transform="translate(14 -130)" fill="#3e7d32"><path d="M0 0 Q-40 -10 -60 20 Q-30 0 0 0"/><path d="M0 0 Q40 -12 62 16 Q30 -2 0 0"/><path d="M0 0 Q-18 -40 -40 -46 Q-8 -30 0 0"/><path d="M0 0 Q20 -40 44 -42 Q10 -28 0 0"/></g></g>
      <g transform="translate(1150 575)"><path d="M0 0 C-4 -50 -10 -90 -16 -120" stroke="#8a6a3f" stroke-width="7" fill="none"/><g transform="translate(-16 -120)" fill="#447f35"><path d="M0 0 Q-40 -10 -60 20 Q-30 0 0 0"/><path d="M0 0 Q40 -12 62 16 Q30 -2 0 0"/><path d="M0 0 Q-18 -40 -40 -46 Q-8 -30 0 0"/><path d="M0 0 Q20 -40 44 -42 Q10 -28 0 0"/></g></g>
      <g transform="translate(40 470)" fill="#5c9b3e"><ellipse cx="0" cy="0" rx="22" ry="40" transform="rotate(-25)"/><ellipse cx="18" cy="-8" rx="20" ry="38" transform="rotate(20)"/><rect x="-3" y="10" width="7" height="40" fill="#6d8a3a"/></g>
    </g>

    <!-- house -->
    <g id="house" class="obj" role="button" tabindex="0" aria-label="Nhà: nghỉ ngơi">
      <ellipse class="hl" cx="170" cy="300" rx="150" ry="120" fill="url(#glow)"/>
      <rect x="80" y="245" width="180" height="95" fill="#d8c29a"/>
      <rect x="150" y="280" width="36" height="60" fill="#5b4128"/>
      <rect x="96" y="270" width="36" height="26" fill="#5b4128" opacity=".75"/>
      <rect x="204" y="270" width="36" height="26" fill="#5b4128" opacity=".75"/>
      <path d="M58 250 L170 170 L282 250Z" fill="#c9a24b"/>
      <path d="M58 250 L170 170 L282 250Z" fill="url(#thatch)" opacity=".6"/>
      <path d="M58 250 H282" stroke="#9c7632" stroke-width="5"/>
      <rect x="84" y="340" width="172" height="8" fill="#9c7a52"/>
    </g>

    <!-- ledger bench -->
    <g id="ledger" class="obj" role="button" tabindex="0" aria-label="Sổ: tiền và nợ">
      <circle class="hl" cx="255" cy="372" r="38" fill="url(#glow)"/>
      <rect x="226" y="372" width="60" height="10" fill="#8a6a3f"/><rect x="232" y="382" width="5" height="14" fill="#8a6a3f"/><rect x="276" y="382" width="5" height="14" fill="#8a6a3f"/>
      <g transform="translate(242 358) rotate(-8)"><rect width="30" height="18" fill="#5b6bc0"/><rect x="2" y="2" width="26" height="14" fill="#f7f8f1"/><path d="M15 2 V16" stroke="#5b6bc0"/></g>
    </g>

    <!-- sign for hired work -->
    <g id="sign" class="obj" role="button" tabindex="0" aria-label="Bảng gỗ: đi làm thuê">
      <circle class="hl" cx="700" cy="50" r="68" fill="url(#glow)"/>
      <rect x="696" y="60" width="8" height="42" fill="#6f5130"/>
      <rect x="638" y="20" width="124" height="44" rx="3" fill="#a07b4a" stroke="#6f5130" stroke-width="3"/>
      <text id="signText" x="700" y="48" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="19" fill="#fff8e6">Cần người gặt</text>
    </g>

    <!-- pump shed -->
    <g transform="translate(900 380)">
      <rect x="10" y="40" width="90" height="70" fill="#c7b58c"/><path d="M0 44 L55 10 L110 44Z" fill="#8e8e8e"/>
      
      <text x="55" y="84" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="12" fill="#5b4128">máy bơm</text>
    </g>

    <g id="plots"></g>

    <!-- character -->
    <g id="char" style="transform:translate(215px,392px)">
      <ellipse cx="0" cy="26" rx="16" ry="5" fill="rgba(0,0,0,.25)"/>
      <rect x="-8" y="2" width="16" height="22" rx="4" fill="#3a5d8c"/>
      <rect x="-7" y="18" width="5" height="10" fill="#2c2a22"/><rect x="2" y="18" width="5" height="10" fill="#2c2a22"/>
      <circle cx="0" cy="-4" r="7" fill="#d9a877"/>
      <path d="M-18 -4 L0 -22 L18 -4Z" fill="#e8d59a" stroke="#b39a55" stroke-width="1.5"/>
    </g>

    <rect id="tint" width="1200" height="720" fill="#f6c27a" opacity=".08"/>
    <g id="stars" opacity="0">
      <rect width="1200" height="720" fill="#0e1a3a" opacity=".62"/>
      <g fill="#fff8d6"><circle cx="120" cy="40" r="1.6"/><circle cx="420" cy="30" r="1.2"/><circle cx="760" cy="48" r="1.8"/><circle cx="1010" cy="26" r="1.3"/><circle cx="600" cy="140" r="1.1"/><circle cx="880" cy="160" r="1.4"/></g>
      <g fill="#e7ff8a"><circle cx="500" cy="420" r="2"/><circle cx="760" cy="300" r="2"/><circle cx="330" cy="470" r="2"/></g>
      <rect x="96" y="270" width="36" height="26" fill="#ffcf6b" opacity=".9"/><rect x="204" y="270" width="36" height="26" fill="#ffcf6b" opacity=".9"/>
    </g>
  </svg></div>
  <div id="rain"></div>

  <div id="calendar" class="hud" aria-live="polite">
    <div class="ring"></div>
    <div class="mon" id="calMon">Tháng 11</div>
    <div class="num" id="calNum">27</div>
    <div class="wd" id="calWd">Thứ Sáu</div>
    <div class="sub" id="calSub">Vụ Đông Xuân<br>Còn 68 ngày đến Tết</div>
  </div>

  <div id="purse" class="hud">
    <div class="lbl">Tiền mặt</div>
    <div class="cash" id="cash">1.850.000 đ</div>
    <div class="lbl" style="margin-top:8px">Sức lực <span id="energyTxt"></span></div>
    <div class="bar" id="energyBar"><i></i></div>
    <div class="lbl">Uy tín trong làng <span id="uyTinTxt"></span></div>
    <div class="bar" id="uyTinBar"><i></i></div>
    <div id="wxNow"></div>
  </div>

  <div id="strip" class="hud">
    <svg id="sunArc" width="84" height="44" viewBox="0 0 84 44" aria-hidden="true">
      <path d="M6 40 A36 36 0 0 1 78 40" fill="none" stroke="#d9d2bb" stroke-width="3" stroke-dasharray="3 5"/>
      <circle id="sunDot" cx="20" cy="18" r="7" fill="#f0b43a"/>
    </svg>
    <div id="prompt"></div>
    <div id="stripBtns"></div>
  </div>

  <div id="tag"></div>
  <div id="toast" role="status"></div>
  <div id="note" class="note paper" hidden></div>
  <div id="veil"></div>
  <div id="book" class="book paper" role="dialog" aria-modal="true"></div>
</div>

<script>
(function(){
"use strict";
// ---------- data (giá trị tạm, khớp DATA_SPEC) ----------
var ML=[31,28,31,30,31,30,31,31,30,31,30,31];
var WD=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
var VAR={A:{name:"Giống A",dur:90,seed:250000},B:{name:"Giống B",dur:102,seed:350000}};
var STAGE_VI={empty:"Ruộng trống",germination:"Nảy mầm",tillering:"Đẻ nhánh",panicle:"Làm đòng",flowering:"Trổ bông",ripening:"Đang chín",harvestable:"Có thể gặt"};
var WX={sunny:"Nắng",cloudy:"Nhiều mây",rain:"Mưa",heavy_rain:"Mưa lớn",storm:"Bão"};
var WX_DIST={11:{sunny:.35,cloudy:.3,rain:.25,heavy_rain:.07,storm:.03},12:{sunny:.55,cloudy:.3,rain:.12,heavy_rain:.03,storm:0},1:{sunny:.65,cloudy:.27,rain:.07,heavy_rain:.01,storm:0},2:{sunny:.7,cloudy:.25,rain:.05,heavy_rain:0,storm:0}};
var NEI={sunny:["cloudy"],cloudy:["sunny","rain"],rain:["cloudy","heavy_rain"],heavy_rain:["rain","storm"],storm:["heavy_rain"]};
var WATER_D={sunny:-8,cloudy:-4,rain:6,heavy_rain:15,storm:25};
var GROW={11:.95,12:.9,1:.9,2:.92};
var PESTS={
  bph:{name:"rầy nâu",spawn:.008,rate:.12,wf:{sunny:1.2,cloudy:1,rain:.8,heavy_rain:.7,storm:.6},vis:.15,dmg:.3,dpd:.06,eff:.85,
    signs:["Gốc lúa lác đác rầy nhỏ màu nâu","Gốc lúa có nhiều rầy, bẹ lá hơi vàng","Lúa khô cháy từng chòm, rầy bám dày ở gốc"],lv:[.35,.6]},
  blast:{name:"đạo ôn",spawn:.006,rate:.1,wf:{sunny:.7,cloudy:1.1,rain:1.4,heavy_rain:1.5,storm:1.2},vis:.12,dmg:.25,dpd:.07,eff:.8,
    signs:["Lá có vài vết hình thoi màu nâu xám","Nhiều vết hình thoi, lá bắt đầu cháy","Cổ bông thâm đen, bông lúa lép trắng"],lv:[.3,.55]}
};
var COST={fert:350000,spray:300000,water:50000,prep:400000,living:40000,wage:150000};
var EN={visit:5,fert:15,spray:20,water:10,sow:30,work:35,rest:25,night:60};
var PLOT_POS=[[370,170],[625,170],[880,170],[370,365],[625,365]];
var PW=240, PH=170;

// ---------- rng ----------
var seed=20261127>>>0;
function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
function pickW(d){ var r=rnd(),a=0; for(var k in d){ a+=d[k]; if(r<a) return k; } return "cloudy"; }

// ---------- state ----------
var S={
  day:12, phase:"briefing", mode:"idle", energy:72, cash:1850000, uyTin:50,
  debts:[{id:"family",name:"Vay họ hàng",amount:5000000,due:364},{id:"credit",name:"Mua chịu – đại lý Tư Lợi",amount:2415000,due:null,dueTxt:"trừ khi bán lúa"},{id:"rent2",name:"Tiền thuê kỳ 2",amount:5000000,due:150}],
  wx:{q:["cloudy","rain","cloudy"],fc:[]},
  alert:null, hiredToday:true, lastVisit:9, radio:[],
  plots:[
    {st:"growing",v:"A",sow:3,g:8.6,water:52,health:.97,fert:0,pest:{bph:0,blast:0}},
    {st:"growing",v:"A",sow:3,g:8.6,water:47,health:.95,fert:0,pest:{bph:0,blast:.1}},
    {st:"growing",v:"A",sow:4,g:7.7,water:58,health:.98,fert:0,pest:{bph:0,blast:0}},
    {st:"growing",v:"B",sow:6,g:5.8,water:44,health:.96,fert:0,pest:{bph:.04,blast:0}},
    {st:"empty",water:30,health:1,fert:0,pest:{bph:0,blast:0}}
  ],
  skipReason:null
};
S.plots.forEach(function(p){ p.known=snapshot(p); p.known.day=9; });
makeForecast();
S.radio=["Đài huyện: tuần này trời nhiều mây, rải rác có mưa chiều tối.","Giá lúa tươi tại ruộng: khoảng 7.100 đ/kg, ít biến động."];

// ---------- helpers ----------
function dateOf(day){ var m=11,d=15+day; while(d>ML[m-1]){ d-=ML[m-1]; m=m%12+1; } return {m:m,d:d}; }
function monthOf(day){ return dateOf(day).m; }
function vnd(n){ return (n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("vi-VN")+" đ"; }
function stageOf(p){ if(p.st==="empty") return "empty"; var veg=VAR[p.v].dur-60,g=p.g; if(g<7) return "germination"; if(g<veg) return "tillering"; if(g<veg+25) return "panicle"; if(g<veg+32) return "flowering"; if(g<veg+60) return "ripening"; return "harvestable"; }
function waterTxt(w){ return w<40?"hơi cạn":w>70?"ngập nhiều":"vừa đủ"; }
function healthTxt(h){ return h>.85?"lúa khỏe":h>.65?"lúa hơi yếu":"lúa yếu"; }
function snapshot(p){ var signs=[]; for(var k in PESTS){ var P=PESTS[k],d=p.pest[k]; if(p.st!=="empty"&&d>=P.vis){ signs.push(P.signs[d>=P.lv[1]?2:d>=P.lv[0]?1:0]); } }
  return {stage:stageOf(p),water:waterTxt(p.water),health:p.st==="empty"?"":healthTxt(p.health),signs:signs,v:p.v,day:S?S.day:0}; }
function fcOne(real,acc){ if(rnd()<acc) return real; var n=NEI[real]; return n[Math.floor(rnd()*n.length)]; }
function makeForecast(){ var q=S.wx.q; S.wx.fc=[{w:fcOne(q[0],.85),c:"khá chắc"},{w:fcOne(q[1],.7),c:"tương đối"},{w:fcOne(q[2],.55),c:"chưa chắc"}]; }
function daysToTet(){ return 80-S.day; }
function season(){ return "Vụ Đông Xuân"; }

// ---------- icons ----------
function wxIcon(w,s){ s=s||26; var sun='<circle cx="12" cy="12" r="5" fill="#f0b43a"/><g stroke="#f0b43a" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></g>';
  var cloud='<path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6-1A3.5 3.5 0 0 0 7 18z" fill="#aab4c3"/>';
  var drops=function(n){ var o=""; for(var i=0;i<n;i++){ o+='<path d="M'+(8+i*4)+' 19l-1.5 3" stroke="#4e8fd0" stroke-width="1.8" stroke-linecap="round"/>'; } return o; };
  var inner=w==="sunny"?sun:w==="cloudy"?'<circle cx="8" cy="8" r="4" fill="#f0b43a"/>'+cloud:w==="rain"?cloud+drops(2):w==="heavy_rain"?cloud.replace("#aab4c3","#7d879a")+drops(3):cloud.replace("#aab4c3","#5d6577")+'<path d="M12 17l-2 4h3l-2 3" stroke="#f0c93a" stroke-width="1.8" fill="none"/>';
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 26" aria-hidden="true">'+inner+'</svg>'; }

// ---------- plots render ----------
var plotsG=document.getElementById("plots");
function renderPlots(){
  var html="";
  S.plots.forEach(function(p,i){
    var x=PLOT_POS[i][0],y=PLOT_POS[i][1],k=p.known,stale=S.day-k.day;
    var pat="p-"+(k.stage);
    var waterOp=k.stage==="empty"||k.stage==="germination"?.55:k.stage==="tillering"?.35:.15;
    html+='<g class="obj plot" data-i="'+i+'" role="button" tabindex="0" aria-label="Thửa '+(i+1)+': '+STAGE_VI[k.stage]+'">'+
      '<rect class="hl" x="'+(x-10)+'" y="'+(y-10)+'" width="'+(PW+20)+'" height="'+(PH+20)+'" rx="12" fill="#fff4c2" opacity="0"/>'+
      '<rect x="'+x+'" y="'+y+'" width="'+PW+'" height="'+PH+'" rx="6" fill="#8a6b45"/>'+
      '<rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+(PW-18)+'" height="'+(PH-18)+'" fill="#6b4f33"/>'+
      '<rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+(PW-18)+'" height="'+(PH-18)+'" fill="#5aa6a0" opacity="'+waterOp+'"/>'+
      '<rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+(PW-18)+'" height="'+(PH-18)+'" fill="url(#'+pat+')"/>'+
      (stale>=2&&S.mode!=="field"?'<rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+(PW-18)+'" height="'+(PH-18)+'" fill="#e9eee0" opacity=".28"/>':'')+
      '<g transform="translate('+(x+18)+' '+(y+PH-8)+')"><rect x="0" y="-34" width="5" height="34" fill="#6f5130"/><rect x="-6" y="-50" width="'+(stale>=2&&S.mode!=="field"?178:52)+'" height="20" rx="3" fill="#fffdf6" stroke="#6f5130"/>'+
      '<text x="0" y="-35" font-family="Be Vietnam Pro, sans-serif" font-size="12" fill="#2c2a22">Thửa '+(i+1)+(stale>=2&&S.mode!=="field"?', thấy '+stale+' ngày trước':'')+'</text></g>'+
      (k.signs.length?'<g transform="translate('+(x+PW-26)+' '+(y+26)+')"><circle r="15" fill="#b8352c"/><text y="6" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="18" fill="#fff">!</text></g>':'')+
      '</g>';
  });
  plotsG.innerHTML=html;
  plotsG.querySelectorAll(".plot").forEach(function(g){
    var hl=g.querySelector(".hl"); g.addEventListener("mouseenter",function(){ hl.setAttribute("opacity",".5"); });
    g.addEventListener("mouseleave",function(){ hl.setAttribute("opacity","0"); });
    bindObj(g,function(){ onPlot(+g.dataset.i); }, S.mode==="field"?"Xem thửa "+(+g.dataset.i+1):"Ruộng: ra đồng");
  });
}

// ---------- HUD ----------
function renderHUD(){
  var dt=dateOf(S.day);
  document.getElementById("calMon").textContent="Tháng "+dt.m;
  document.getElementById("calNum").textContent=dt.d;
  document.getElementById("calWd").textContent=WD[(S.day)%7];
  document.getElementById("calSub").innerHTML=season()+"<br>Còn "+daysToTet()+" ngày đến Tết";
  var c=document.getElementById("cash"); c.textContent=vnd(S.cash); c.style.color=S.cash<0?"var(--danger)":"";
  document.querySelector("#energyBar i").style.width=S.energy+"%";
  document.getElementById("energyTxt").textContent=S.energy+"/100";
  document.querySelector("#uyTinBar i").style.width=S.uyTin+"%";
  document.getElementById("uyTinTxt").textContent=Math.round(S.uyTin)+"/100";
  var w=S.wx.q[0]; document.getElementById("wxNow").innerHTML=wxIcon(w,22)+"<span>Hôm nay: "+WX[w]+"</span>";
  var r=document.getElementById("rain"); r.className=(w==="rain"?"on":(w==="heavy_rain"||w==="storm")?"on heavy":"");
  document.getElementById("signText").textContent=S.hiredToday?"Cần người gặt":"Hôm nay nghỉ";
  // time of day
  var sun=document.getElementById("sunDot"),tint=document.getElementById("tint"),stars=document.getElementById("stars");
  var pos={briefing:[14,30],morning:[24,12],afternoon:[62,12],night:[74,34]}[S.phase]||[24,12];
  sun.setAttribute("cx",pos[0]); sun.setAttribute("cy",pos[1]); sun.setAttribute("fill",S.phase==="night"?"#c9d4ff":"#f0b43a");
  tint.setAttribute("fill",S.phase==="afternoon"?"#f39a4a":"#f6c27a"); tint.setAttribute("opacity",S.phase==="afternoon"?".14":".06");
  stars.setAttribute("opacity",S.phase==="night"?"1":"0");
  renderStrip();
}
function renderStrip(){
  var p=document.getElementById("prompt"),b=document.getElementById("stripBtns");
  var half=S.phase==="morning"?"Buổi sáng":"Buổi chiều";
  if(S.phase==="night"){ p.innerHTML="<b>Trời tối.</b> Cả nhà ăn cơm, đi ngủ sớm."; b.innerHTML=""; return; }
  if(S.phase==="briefing"){ p.innerHTML="<b>Sáng sớm.</b> Đọc bản tin trước khi bắt đầu ngày."; b.innerHTML='<button class="btn" id="openBrief">Mở bản tin</button>'; document.getElementById("openBrief").onclick=openBriefing; return; }
  if(S.mode==="field"){ p.innerHTML="<b>"+half+", ngoài đồng.</b> Bấm vào từng thửa để xem kỹ và làm việc."; b.innerHTML='<button class="btn" id="doneField">Xong việc, về nhà</button>'; document.getElementById("doneField").onclick=endHalf; return; }
  p.innerHTML="<b>"+half+".</b> Chọn việc: bấm vào ruộng để ra đồng, bảng gỗ để đi làm thuê, hoặc về nhà nghỉ.";
  b.innerHTML="";
}
function render(){ renderHUD(); renderPlots(); }

// ---------- interaction ----------
var tag=document.getElementById("tag"), game=document.getElementById("game");
function bindObj(el,fn,label){
  el.onclick=function(e){ e.stopPropagation(); tag.style.opacity=0; fn(); };
  el.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } };
  el.onmousemove=function(e){ var r=game.getBoundingClientRect(); tag.style.left=(e.clientX-r.left)+"px"; tag.style.top=(e.clientY-r.top)+"px"; tag.textContent=label; tag.style.opacity=1; };
  el.onmouseleave=function(){ tag.style.opacity=0; };
}
function busy(){ return S.phase==="briefing"||S.phase==="night"||bookOpen; }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(function(){ t.classList.remove("show"); },2600); }
function moveChar(x,y){ document.getElementById("char").style.transform="translate("+x+"px,"+y+"px)"; }
var HOME=[215,392];

bindObj(document.getElementById("house"),function(){
  if(busy()) return;
  if(S.mode==="field"){ toast("Đang ở ngoài đồng. Bấm “Xong việc, về nhà” trước."); return; }
  S.energy=Math.min(100,S.energy+EN.rest); toast("Nghỉ ngơi ở nhà. Sức lực +"+EN.rest+".");
  endHalf();
},"Nhà: nghỉ ngơi");
bindObj(document.getElementById("sign"),function(){
  if(busy()) return;
  if(S.mode==="field"){ toast("Đang ở ngoài đồng. Bấm “Xong việc, về nhà” trước."); return; }
  if(!S.hiredToday){ toast("Hôm nay không ai thuê. Thử lại ngày mai."); return; }
  if(S.energy<EN.work){ toast("Không đủ sức đi làm thuê (cần "+EN.work+")."); return; }
  moveChar(700,112);
  setTimeout(function(){ S.cash+=COST.wage; S.energy-=EN.work; S.uyTin=Math.min(100,S.uyTin+.5); toast("Gặt thuê nửa ngày: +"+vnd(COST.wage)+"."); endHalf(); },1100);
},"Bảng gỗ: đi làm thuê");
bindObj(document.getElementById("ledger"),function(){ if(S.phase==="night") return; openLedger(); },"Sổ: tiền và nợ");

function onPlot(i){
  if(busy()) return;
  if(S.mode!=="field"){
    if(S.energy<EN.visit){ toast("Không đủ sức ra đồng."); return; }
    S.mode="field"; S.energy-=EN.visit; S.lastVisit=S.day;
    S.plots.forEach(function(p){ p.known=snapshot(p); });
    var sig=S.plots.filter(function(p){ return p.known.signs.length; }).length;
    render(); moveChar(PLOT_POS[i][0]+PW/2,PLOT_POS[i][1]+PH+8);
    if(sig) toast("Có "+sig+" thửa thấy dấu hiệu lạ.");
    setTimeout(function(){ openNote(i); },650);
    return;
  }
  moveChar(PLOT_POS[i][0]+PW/2,PLOT_POS[i][1]+PH+8);
  openNote(i);
}

// ---------- plot note ----------
var noteEl=document.getElementById("note");
function actBtn(label,cost,en,fn){
  var can=S.energy>=en, afford=S.cash>=cost;
  var why=!can?"Không đủ sức (cần "+en+")":!afford?"Không đủ tiền mặt":"";
  return {html:'<button class="act" '+(why?'disabled':'')+'><span>'+label+'</span><small>'+vnd(cost)+', '+en+' sức</small></button>'+(why?'<div class="why">'+why+'</div>':''),
    fn:fn,ok:!why,cost:cost,en:en,creditOk:can&&!afford};
}
function openNote(i){
  var p=S.plots[i],k=p.known,acts=[];
  var body='<button class="close" aria-label="Đóng">×</button><h3>Thửa '+(i+1)+'</h3>';
  if(p.st==="empty"){
    body+='<div class="meta">Ruộng trống, nước '+k.water+'.</div><p>Làm đất rồi sạ giống:</p>';
    ["A","B"].forEach(function(v){ var c=Math.round(VAR[v].seed*1.5)+COST.prep; acts.push(actBtn("Sạ "+VAR[v].name+" ("+VAR[v].dur+" ngày)",c,EN.sow,function(credit){ pay(c,credit,"giống và làm đất"); p.st="growing"; p.v=v; p.sow=S.day; p.g=0; p.water=55; p.health=1; p.fert=0; S.energy-=EN.sow; })); });
  } else {
    var st=stageOf(p);
    body+='<div class="meta">'+VAR[p.v].name+', '+STAGE_VI[st].toLowerCase()+' (ngày '+(S.day-p.sow)+')<br>Nước '+k.water+', '+k.health+'.</div>';
    body+=k.signs.length?k.signs.map(function(s){ return '<div class="sign">• '+s+'</div>'; }).join(""):'<div>Không thấy dấu hiệu lạ.</div>';
    var rec=(st==="tillering"&&p.fert<1)||(st==="panicle"&&p.fert<2);
    acts.push(actBtn("Bón phân"+(rec?" (đúng lúc)":""),COST.fert,EN.fert,function(credit){ pay(COST.fert,credit,"phân bón"); p.fert++; S.energy-=EN.fert; }));
    acts.push(actBtn("Phun thuốc trị rầy",COST.spray,EN.spray,function(credit){ pay(COST.spray,credit,"thuốc"); p.pest.bph*= (1-PESTS.bph.eff); S.energy-=EN.spray; }));
    acts.push(actBtn("Phun thuốc trị đạo ôn",COST.spray,EN.spray,function(credit){ pay(COST.spray,credit,"thuốc"); p.pest.blast*=(1-PESTS.blast.eff); S.energy-=EN.spray; }));
    if(p.water<40||p.water>70) acts.push(actBtn("Chỉnh nước (bơm/tháo)",COST.water,EN.water,function(credit){ pay(COST.water,credit,"dầu bơm"); p.water=55; S.energy-=EN.water; }));
  }
  var html=body+'<div class="acts">';
  acts.forEach(function(a,ix){ html+='<div data-a="'+ix+'">'+a.html; if(a.creditOk){ html+='<button class="act credit"><span>Mua chịu ở đại lý, trả khi bán lúa</span><small>'+vnd(Math.round(a.cost*1.15))+'</small></button>'; } html+='</div>'; });
  html+='</div>';
  noteEl.innerHTML=html; noteEl.hidden=false;
  // position near plot
  var g=plotsG.querySelector('[data-i="'+i+'"]'), r=g.getBoundingClientRect(), gr=game.getBoundingClientRect();
  var w=noteEl.offsetWidth,h=noteEl.offsetHeight;
  var left=r.right-gr.left+12; if(left+w>gr.width-12) left=r.left-gr.left-w-12; if(left<12) left=Math.max(12,(gr.width-w)/2);
  var top=Math.min(Math.max(150,r.top-gr.top), gr.height-h-110); if(top<12) top=12;
  noteEl.style.left=left+"px"; noteEl.style.top=top+"px"; noteEl.style.transform="rotate("+(i%2?1.2:-1.4)+"deg)";
  noteEl.querySelector(".close").onclick=closeNote;
  noteEl.querySelectorAll("[data-a]").forEach(function(box){
    var a=acts[+box.dataset.a], btns=box.querySelectorAll("button");
    btns[0].onclick=function(){ if(!a.ok) return; a.fn(false); after(i); };
    if(btns[1]) btns[1].onclick=function(){ a.fn(true); after(i); };
  });
}
function pay(cost,credit,what){
  if(credit){ var d=S.debts.find(function(x){ return x.id==="credit"; }); d.amount+=Math.round(cost*1.15); toast("Ghi nợ đại lý: "+vnd(Math.round(cost*1.15))+" tiền "+what+"."); }
  else { S.cash-=cost; }
}
function after(i){ var p=S.plots[i]; p.known=snapshot(p); render(); openNote(i); }
function closeNote(){ noteEl.hidden=true; }
game.addEventListener("click",function(e){ if(!noteEl.hidden&&!noteEl.contains(e.target)) closeNote(); });

// ---------- phases ----------
function endHalf(){
  closeNote(); tag.style.opacity=0;
  if(S.phase==="morning"){ S.phase="afternoon"; S.mode="idle"; moveChar(HOME[0],HOME[1]); render(); toast("Sang buổi chiều."); return; }
  if(S.phase==="afternoon"){ S.mode="idle"; moveChar(HOME[0],HOME[1]); S.phase="night"; render();
    setTimeout(function(){ night(); S.phase="briefing"; flipCal(); render(); setTimeout(openBriefing,500); },1700); }
}
function night(){
  var w=S.wx.q[0], m=monthOf(S.day);
  S.cash-=COST.living;
  S.plots.forEach(function(p){
    p.water=Math.max(0,Math.min(100,p.water+WATER_D[w]));
    if(p.st==="empty") return;
    var stress=p.water<40||p.water>70;
    if(stress) p.health=Math.max(0,p.health-.01);
    p.g+=(GROW[m]||1)*(stress?.7:1)*(p.health<.5?.8:1);
    var stg=stageOf(p);
    for(var k in PESTS){ var P=PESTS[k],d=p.pest[k];
      if(d<=0){ if(rnd()<P.spawn*(S.alert===k?3:1)) d=.03; }
      else { d=Math.min(1,d+d*P.rate*P.wf[w]*(stg==="flowering"?1.3:1)); }
      if(d>P.dmg) p.health=Math.max(0,p.health-P.dpd*d);
      p.pest[k]=d; }
  });
  S.day++;
  var nm=monthOf(S.day+2);
  S.wx.q=[S.wx.q[1],S.wx.q[2],pickW(WX_DIST[nm]||WX_DIST[12])];
  makeForecast();
  S.energy=Math.min(100,S.energy+EN.night);
  S.hiredToday=rnd()<.6;
  S.radio=[];
  if(!S.alert&&rnd()<.06){ S.alert=rnd()<.5?"bph":"blast"; S.alertUntil=S.day+14; S.radio.push("Trạm khuyến nông: "+PESTS[S.alert].name+" đang xuất hiện ở các ấp lân cận, bà con thăm đồng thường xuyên."); S.newAlert=true; } else S.newAlert=false;
  if(S.alert&&S.day>S.alertUntil) S.alert=null;
  var price=7100+Math.round((rnd()-.5)*300/10)*10;
  S.radio.push("Giá lúa tươi tại ruộng hôm nay khoảng "+price.toLocaleString("vi-VN")+" đ/kg.");
  if(S.wx.fc[1].w==="heavy_rain"||S.wx.fc[1].w==="storm") S.radio.push("Đài khí tượng: ngày mai có khả năng "+WX[S.wx.fc[1].w].toLowerCase()+".");
}
function flipCal(){ var c=document.getElementById("calendar"); c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip"); }

// ---------- notebook modal ----------
var book=document.getElementById("book"), veil=document.getElementById("veil"), bookOpen=false;
function showBook(html){ book.innerHTML=html; book.classList.add("show"); veil.classList.add("show"); bookOpen=true; closeNote(); var f=book.querySelector("button"); if(f) f.focus(); }
function hideBook(){ book.classList.remove("show"); veil.classList.remove("show"); bookOpen=false; }
function nearestDebt(){ var ds=S.debts.filter(function(d){ return d.due!=null; }).sort(function(a,b){ return a.due-b.due; }); return ds[0]; }

function openBriefing(){
  var dt=dateOf(S.day), since=S.day-S.lastVisit, nd=nearestDebt();
  var html='<h2>Sáng '+WD[S.day%7].toLowerCase()+', '+dt.d+' tháng '+dt.m+'</h2>';
  if(S.skipReason){ html+='<p style="color:var(--margin)">Dừng tua: '+S.skipReason+'</p>'; S.skipReason=null; }
  html+='<h4>Trời</h4><div class="fc">';
  ["Hôm nay","Ngày mai","Ngày mốt"].forEach(function(l,i){ var f=S.wx.fc[i]; html+='<div>'+wxIcon(f.w,28)+'<span>'+l+': '+WX[f.w]+' <small>('+f.c+')</small></span></div>'; });
  html+='</div><h4>Radio</h4><p class="typed" id="typed"></p>';
  html+='<h4>Ruộng</h4><p>Lần cuối ra đồng: '+(since===0?'hôm nay':since+' ngày trước')+'.</p>';
  S.plots.forEach(function(p,i){ var k=p.known; html+='<p>Thửa '+(i+1)+': '+STAGE_VI[k.stage].toLowerCase()+(k.stage==="empty"?'':', nước '+k.water)+(k.signs.length?', <span style="color:var(--danger)">có dấu hiệu lạ</span>':'')+'</p>'; });
  html+='<h4>Tiền</h4><p>Tiền mặt '+vnd(S.cash)+'. Khoản gần hạn nhất: '+nd.name.toLowerCase()+', '+vnd(nd.amount)+', còn '+(nd.due-S.day)+' ngày.</p>';
  html+='<div class="row"><button class="btn" id="startDay">Bắt đầu ngày</button><button class="btn ghost" id="skipBtn">Tua đến khi…</button></div>';
  showBook(html);
  typeLines(S.radio.join("\n"));
  document.getElementById("startDay").onclick=function(){ hideBook(); S.phase="morning"; S.mode="idle"; render(); };
  document.getElementById("skipBtn").onclick=openSkip;
}
function typeLines(txt){ var el=document.getElementById("typed"); if(!el) return; if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=txt; return; }
  var i=0; clearInterval(typeLines.t); typeLines.t=setInterval(function(){ if(!document.getElementById("typed")){ clearInterval(typeLines.t); return; } i+=2; el.textContent=txt.slice(0,i); if(i>=txt.length) clearInterval(typeLines.t); },18); }

function openSkip(){
  var html='<h2>Tua đến khi…</h2><p>Những ngày tua, mình sẽ:</p>'+
  '<label class="check"><input type="radio" name="def" value="rest" checked> Nghỉ ở nhà</label>'+
  '<label class="check"><input type="radio" name="def" value="work"> Đi làm thuê khi có việc</label>'+
  '<h4>Dừng lại khi</h4>'+
  '<label class="check"><input type="checkbox" id="s1" checked> Dự báo mưa lớn hoặc bão</label>'+
  '<label class="check"><input type="checkbox" id="s2" checked> Radio báo có dịch</label>'+
  '<label class="check"><input type="checkbox" id="s3" checked> Còn 3 ngày tới hạn nợ</label>'+
  '<p>Tối đa <select id="maxD"><option>3</option><option selected>7</option><option>14</option><option>30</option></select> ngày</p>'+
  '<p style="font-size:16px;color:var(--ink-soft)">Bão, lũ và chủ nợ đến nhà luôn làm dừng tua.</p>'+
  '<div class="row"><button class="btn" id="goSkip">Bắt đầu tua</button><button class="btn ghost" id="backBrief">Quay lại bản tin</button></div>';
  showBook(html);
  document.getElementById("backBrief").onclick=openBriefing;
  document.getElementById("goSkip").onclick=function(){
    var def=book.querySelector('input[name="def"]:checked').value, c1=document.getElementById("s1").checked,c2=document.getElementById("s2").checked,c3=document.getElementById("s3").checked, max=+document.getElementById("maxD").value;
    hideBook(); runSkip(def,c1,c2,c3,max);
  };
}
function runSkip(def,c1,c2,c3,max){
  var n=0, earned=0;
  S.phase="night"; render();
  function step(){
    for(var h=0;h<2;h++){ if(def==="work"&&S.hiredToday&&S.energy>=EN.work){ S.cash+=COST.wage; earned+=COST.wage; S.energy-=EN.work; S.uyTin=Math.min(100,S.uyTin+.5); } else S.energy=Math.min(100,S.energy+EN.rest); }
    night(); n++; flipCal(); renderHUD();
    var reason=null, f1=S.wx.fc[0].w, f2=S.wx.fc[1].w, nd=nearestDebt();
    if(f1==="storm"||f2==="storm") reason="dự báo có bão";
    else if(c1&&(f1==="heavy_rain"||f2==="heavy_rain")) reason="dự báo mưa lớn";
    else if(c2&&S.newAlert) reason="radio báo có dịch "+PESTS[S.alert].name;
    else if(c3&&nd.due-S.day<=3) reason="sắp tới hạn "+nd.name.toLowerCase();
    else if(n>=max) reason="đã tua đủ "+max+" ngày";
    if(reason){ S.skipReason=reason+(earned?" (làm thuê được "+vnd(earned)+")":"")+"."; S.phase="briefing"; render(); setTimeout(openBriefing,450); }
    else setTimeout(step,window.matchMedia("(prefers-reduced-motion: reduce)").matches?60:420);
  }
  setTimeout(step,300);
}

function openLedger(){
  var html='<h2>Sổ tiền nợ</h2><p>Tiền mặt: '+vnd(S.cash)+'</p><h4>Đang nợ</h4>';
  S.debts.forEach(function(d){ html+='<div class="ledger-line in"><span>'+d.name+'</span><span>'+vnd(d.amount)+'</span></div><p style="font-size:15px;color:var(--ink-soft);line-height:24px">'+(d.due!=null?'Hạn: còn '+(d.due-S.day)+' ngày':'Hạn: '+d.dueTxt)+'</p>'; });
  html+='<div class="row"><button class="btn ghost" id="demoSettle">Xem thử màn tính sổ cuối vụ</button><button class="btn" id="closeLedger">Gấp sổ</button></div>';
  showBook(html);
  document.getElementById("closeLedger").onclick=function(){ hideBook(); if(S.phase==="briefing") openBriefing(); };
  document.getElementById("demoSettle").onclick=openSettlement;
}
function openSettlement(){
  var lines=[["Bán lúa thửa 1 (812 kg)",5820000],["Bán lúa thửa 2 (640 kg, dính đạo ôn)",4590000],["Bán lúa thửa 3 (798 kg)",5720000],["Bán lúa thửa 4 (775 kg)",6360000],["Giống, làm đất",-3875000],["Phân bón (8 lần)",-2800000],["Thuốc (5 lần)",-1500000],["Thuê máy gặt",-1200000],["Lãi mua chịu",-620000],["Sinh hoạt phí trong vụ",-4600000]];
  var total=lines.reduce(function(a,l){ return a+l[1]; },0);
  var html='<h2>Tính sổ vụ Đông Xuân</h2><p style="font-size:16px;color:var(--ink-soft)">Màn hình mẫu, số liệu minh họa.</p><div id="lines">';
  lines.forEach(function(l){ html+='<div class="ledger-line"><span>'+l[0]+'</span><span class="'+(l[1]<0?'neg':'')+'">'+vnd(l[1])+'</span></div>'; });
  html+='<div class="ledger-line total"><span>Vụ này</span><span class="'+(total<0?'neg':'pos')+'">'+(total<0?'lỗ ':'lời ')+vnd(Math.abs(total))+'</span></div></div>';
  html+='<div class="row"><button class="btn" id="closeSettle">Gấp sổ</button></div>';
  showBook(html);
  var ls=book.querySelectorAll(".ledger-line"), rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  ls.forEach(function(el,i){ var last=i===ls.length-1; setTimeout(function(){ el.classList.add("in"); }, rm?0:(last?(i*380+1400):i*380)); });
  document.getElementById("closeSettle").onclick=function(){ hideBook(); if(S.phase==="briefing") openBriefing(); };
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(!noteEl.hidden) closeNote(); } });

// ---------- boot ----------
render();
(function(){ var w=document.getElementById("world"),sc=document.getElementById("scene"); if(sc.clientWidth>w.clientWidth){ w.scrollLeft=sc.clientWidth*(700/1200)-w.clientWidth/2; } })();
setTimeout(openBriefing,500);
})();
</script>
